repos:
  - repo: local
    hooks:
      - id: gdscript-formatter
        name: gdscript-formatter (reformat first-party GDScript)
        entry: task fmt
        language: system
        files: \.gd$
        pass_filenames: false
      - id: gdscript-lint
        name: gdscript-formatter lint (first-party GDScript)
        entry: task lint
        language: system
        files: \.gd$
        pass_filenames: false

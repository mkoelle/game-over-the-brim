<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- 06 Over The Brim: the title as a picture. Tiny hat-cars spill out of an upturned top hat. -->
  <rect x="2" y="2" width="124" height="124" rx="28" fill="#2b1f3a"/>
  <circle cx="64" cy="58" r="44" fill="#4a3566" opacity="0.6"/>
  <g fill="#f2b632"><circle cx="24" cy="30" r="3"/><circle cx="104" cy="24" r="3"/><circle cx="96" cy="50" r="2.5"/><circle cx="30" cy="56" r="2.5"/><circle cx="64" cy="12" r="2.5"/></g>
  <g fill="#2fb3a5"><rect x="40" y="18" width="5" height="5" transform="rotate(20 42 20)"/><rect x="86" y="36" width="5" height="5" transform="rotate(-30 88 38)"/><rect x="16" y="44" width="4" height="4"/></g>
  <!-- upturned hat: the brim ellipse is the opening, seen from slightly above -->
  <path d="M34 82 L38 118 Q64 124 90 118 L94 82 Z" fill="#c8323c"/>
  <rect x="35" y="104" width="58" height="8" fill="#f2b632" transform="skewX(0)"/>
  <ellipse cx="64" cy="82" rx="46" ry="12" fill="#8e1f2a"/>
  <ellipse cx="64" cy="82" rx="30" ry="7" fill="#1b1622"/>
  <!-- cars spilling out in an arc -->
  <g transform="translate(30 50) rotate(-30)">
    <path d="M-7 4 L-6 -10 L6 -10 L7 4 Z" fill="#2fb3a5"/><rect x="-10" y="3" width="20" height="4" rx="2" fill="#1f6f78"/>
    <circle cx="-6" cy="9" r="3" fill="#1b1622"/><circle cx="6" cy="9" r="3" fill="#1b1622"/>
  </g>
  <g transform="translate(62 38)">
    <path d="M-8 4 Q-8 -10 0 -10 Q8 -10 8 4 Z" fill="#f2b632"/><rect x="-11" y="3" width="22" height="4" rx="2" fill="#c08a18"/>
    <circle cx="-6" cy="9" r="3" fill="#1b1622"/><circle cx="6" cy="9" r="3" fill="#1b1622"/>
  </g>
  <g transform="translate(94 54) rotate(28)">
    <path d="M-6 4 L-4 -10 L6 -10 L8 4 Z" fill="#f6efe2"/><rect x="-9" y="3" width="19" height="4" rx="2" fill="#c9c2b2"/>
    <circle cx="-5" cy="9" r="3" fill="#1b1622"/><circle cx="6" cy="9" r="3" fill="#1b1622"/>
  </g>
  <g stroke="#f6efe2" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-dasharray="2 5" opacity="0.8">
    <path d="M46 74 Q36 66 32 62"/><path d="M64 72 L64 54"/><path d="M82 74 Q92 68 94 66"/>
  </g>
</svg>

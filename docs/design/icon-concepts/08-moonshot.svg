<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- 08 Moonshot: a fez-car launches off a ramp shaped like a hat brim, across the moon, steam trail looping behind. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140f24"/>
      <stop offset="1" stop-color="#3b2a52"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="124" height="124" rx="28" fill="url(#sky)"/>
  <g fill="#f6efe2"><circle cx="18" cy="20" r="1.6"/><circle cx="40" cy="12" r="1.2"/><circle cx="112" cy="16" r="1.6"/><circle cx="104" cy="40" r="1.2"/><circle cx="22" cy="48" r="1.2"/><circle cx="58" cy="26" r="1"/></g>
  <circle cx="78" cy="50" r="34" fill="#f6efe2"/>
  <circle cx="66" cy="40" r="6" fill="#e2d8c3"/><circle cx="92" cy="62" r="8" fill="#e2d8c3"/><circle cx="88" cy="34" r="4" fill="#e2d8c3"/>
  <!-- steam trail with a loop -->
  <path d="M14 104 Q30 98 36 86 Q42 72 30 70 Q18 70 24 82 Q30 94 50 82 Q60 74 66 64" stroke="#2fb3a5" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.9"/>
  <!-- brim-shaped ramp: a sweeping curve like a hat brim -->
  <path d="M2 126 L2 112 Q30 110 50 96 L58 100 Q40 118 26 126 Z" fill="#c8323c"/>
  <path d="M2 112 Q30 110 50 96" stroke="#f2b632" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- the fez-car silhouette, mid-air, nose up -->
  <g transform="translate(76 54) rotate(-20)">
    <path d="M-12 8 L-8 -16 L10 -16 L14 8 Z" fill="#1b1622"/>
    <path d="M1 -16 Q6 -26 16 -22 Q22 -18 26 -26" stroke="#f2b632" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="27" cy="-27" r="3.5" fill="#f2b632"/>
    <rect x="-18" y="6" width="36" height="7" rx="3.5" fill="#1b1622"/>
    <circle cx="-10" cy="17" r="6" fill="#1b1622"/><circle cx="10" cy="17" r="6" fill="#1b1622"/>
    <circle cx="-2" cy="-4" r="3.5" fill="#f6efe2"/><circle cx="6" cy="-4" r="3.5" fill="#f6efe2"/>
  </g>
</svg>

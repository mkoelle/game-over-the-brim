<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- 07 Brim Speedway: top-down, the hat's brim is the race track and the crown is the infield. -->
  <rect x="2" y="2" width="124" height="124" rx="28" fill="#3d8a4e"/>
  <circle cx="64" cy="64" r="56" fill="#2a2a33"/>
  <circle cx="64" cy="64" r="44" fill="none" stroke="#f6efe2" stroke-width="2.5" stroke-dasharray="7 6"/>
  <circle cx="64" cy="64" r="56" fill="none" stroke="#c8323c" stroke-width="4" stroke-dasharray="6 6"/>
  <circle cx="64" cy="64" r="56" fill="none" stroke="#f6efe2" stroke-width="4" stroke-dasharray="6 6" stroke-dashoffset="6"/>
  <circle cx="64" cy="64" r="32" fill="#8e1f2a"/>
  <circle cx="64" cy="64" r="32" fill="none" stroke="#f2b632" stroke-width="6"/>
  <circle cx="64" cy="64" r="22" fill="#c8323c"/>
  <circle cx="58" cy="60" r="4.5" fill="#f6efe2"/><circle cx="70" cy="60" r="4.5" fill="#f6efe2"/>
  <circle cx="59" cy="61" r="2" fill="#1b1622"/><circle cx="71" cy="61" r="2" fill="#1b1622"/>
  <path d="M57 70 Q64 75 71 70" stroke="#1b1622" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- start line -->
  <rect x="62" y="8" width="4" height="24" fill="#f6efe2"/>
  <!-- cars on the brim track -->
  <g transform="rotate(25 64 64)"><rect x="58" y="12" width="12" height="16" rx="5" fill="#2fb3a5"/><circle cx="64" cy="17" r="3" fill="#1b1622"/></g>
  <g transform="rotate(115 64 64)"><rect x="58" y="12" width="12" height="16" rx="5" fill="#f2b632"/><circle cx="64" cy="17" r="3" fill="#1b1622"/></g>
  <g transform="rotate(210 64 64)"><rect x="58" y="12" width="12" height="16" rx="5" fill="#f6efe2"/><circle cx="64" cy="17" r="3" fill="#1b1622"/></g>
  <g transform="rotate(300 64 64)"><rect x="58" y="12" width="12" height="16" rx="5" fill="#b05bd1"/><circle cx="64" cy="17" r="3" fill="#1b1622"/></g>
